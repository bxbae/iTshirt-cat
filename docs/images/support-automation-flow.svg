<line x1="275.0" y1="670" x2="275.0" y2="796" stroke="gray" stroke-width="4" marker-end="url(#a-gray)"/>
<line x1="475" y1="875.0" x2="551" y2="875.0" stroke="gray" stroke-width="4" marker-end="url(#a-gray)"/>
<line x1="955" y1="875.0" x2="1031" y2="875.0" stroke="gray" stroke-width="4" marker-end="url(#a-gray)"/>
<line x1="1435" y1="875.0" x2="1511" y2="875.0" stroke="gray" stroke-width="4" marker-end="url(#a-gray)"/>
<text x="1733.0" y="473.0" font-size="22" font-weight="400" fill="#6b7194" text-anchor="start">카드로 초안을 작성</text>
<text x="293.0" y="743.0" font-size="22" font-weight="400" fill="#6b7194" text-anchor="start">승인 후 실행</text>
