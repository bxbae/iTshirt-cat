<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1060" width="2000" height="1060" font-family="'Noto Sans CJK KR','Noto Sans KR','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5a54d6"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e9e6b"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a90b0"/></marker></defs>
<rect width="2000" height="1060" fill="#f6f7fc"/>
<text x="75" y="70" font-size="46" font-weight="800" fill="#1f2547" text-anchor="start">고객지원 Agent 자동화 흐름</text>
<text x="75" y="112" font-size="25" font-weight="400" fill="#6b7194" text-anchor="start">사람은 확인·승인과 짧은 답변만 하고, 나머지는 자동으로 처리</text>
<rect x="1230" y="48" width="34" height="34" rx="8" fill="#e8e8fc" stroke="#5a54d6" stroke-width="3"/>
<text x="1276" y="76" font-size="24" font-weight="400" fill="#6b7194" text-anchor="start">자동</text>
<rect x="1420" y="48" width="34" height="34" rx="8" fill="#fff7e6" stroke="#f2b84b" stroke-width="3"/>
<text x="1466" y="76" font-size="24" font-weight="400" fill="#6b7194" text-anchor="start">사람</text>
