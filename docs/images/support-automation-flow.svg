<text x="1656" y="76" font-size="24" font-weight="400" fill="#6b7194" text-anchor="start">입력</text>
<rect x="1800" y="48" width="34" height="34" rx="8" fill="#e6f6ee" stroke="#2e9e6b" stroke-width="3"/>
<text x="1846" y="76" font-size="24" font-weight="400" fill="#6b7194" text-anchor="start">카드(기록)</text>
<rect x="75" y="260" width="400" height="150" rx="26" fill="#ffffff" stroke="#c9cde0" stroke-width="4"/>
<text x="275.0" y="322" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">문의 접수·신청</text>
<text x="275.0" y="364" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">판매 사이트 문의 위젯 · 클레임</text>
<rect x="555" y="260" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="755.0" y="322" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">자동 분류·정책 검색</text>
<text x="755.0" y="364" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">개인정보 마스킹 → 분류 → 근거 검색</text>
<rect x="1035" y="260" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="1235.0" y="322" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">영수증·정책 판정</text>
<text x="1235.0" y="364" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">규칙 엔진 · 같은 입력 = 같은 결과</text>
<rect x="1515" y="260" width="400" height="150" rx="26" fill="#e6f6ee" stroke="#2e9e6b" stroke-width="4"/>
<text x="1715.0" y="322" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">판정 카드</text>
<text x="1715.0" y="364" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">결과 · 금액 · 규칙 번호 · 근거</text>
<rect x="1515" y="520" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="1715.0" y="582" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">마케팅 조회 ④</text>
<text x="1715.0" y="624" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">유효 공지 · 쿠폰 · 품절 확인</text>
<rect x="1035" y="520" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="1235.0" y="582" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">답변 초안 · 가드</text>
<text x="1235.0" y="624" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">초안 3종 · 약속·금액 검증</text>
<rect x="555" y="520" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="755.0" y="582" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">빈 자리 질문</text>
<text x="755.0" y="624" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">사진 요청 등 짧게 고객에게 질문</text>
<rect x="75" y="520" width="400" height="150" rx="26" fill="#fff7e6" stroke="#f2b84b" stroke-width="4"/>
<text x="275.0" y="582" font-size="31" font-weight="800" fill="#7a4b00" text-anchor="middle">승인 (사람)</text>
<text x="275.0" y="624" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">한도 초과·영수증 불일치만 확인</text>
<rect x="75" y="800" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="275.0" y="862" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">자동 발송 · 지급</text>
<text x="275.0" y="904" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">실행 관문 → 등급 판정 → 실행</text>
<rect x="555" y="800" width="400" height="150" rx="26" fill="#e6f6ee" stroke="#2e9e6b" stroke-width="4"/>
<text x="755.0" y="862" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">사건 카드</text>
<text x="755.0" y="904" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">요약 · 판정 · 근거 → 인사에 전달</text>
<rect x="1035" y="800" width="400" height="150" rx="26" fill="#e8e8fc" stroke="#5a54d6" stroke-width="4"/>
<text x="1235.0" y="862" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">패턴 분석 ③</text>
<text x="1235.0" y="904" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">반복 문의 감지 → 공지·FAQ 초안</text>
<rect x="1515" y="800" width="400" height="150" rx="26" fill="#ffffff" stroke="#c9cde0" stroke-width="4"/>
<text x="1715.0" y="862" font-size="31" font-weight="800" fill="#1f2547" text-anchor="middle">마케팅에 제안</text>
<text x="1715.0" y="904" font-size="22" font-weight="400" fill="#6b7194" text-anchor="middle">게시는 마케팅이 결정</text>
